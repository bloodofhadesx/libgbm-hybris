name: build-trixie-arm64

on:
  push:
    branches: [ lindroid-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          set -eux
          # The Lindroid Halium repo (repo.lindroid.org) sometimes drops TLS
          # connections mid-download, so crank up apt's retry/timeout settings
          # and retry the install a few times.
          cat >> /etc/apt/apt.conf.d/99lindroid <<'EOF'
          Acquire::Retries "10";
          Acquire::https::Timeout "60";
          Acquire::https::LowSpeedTimeout "120";
          EOF
          # ca-certificates first, so apt can verify repo.lindroid.org's TLS cert
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          # android-headers + libhybris-dev live in the Lindroid Halium repo,
          # not in Debian proper; libhybris-dev pulls android-headers in.
          echo "deb [trusted=yes] https://repo.lindroid.org/repository/lindroid trixie main" \
            > /etc/apt/sources.list.d/lindroid.list
          apt-get update
          for attempt in 1 2 3 4 5; do
            if apt-get install -y --no-install-recommends \
                 build-essential pkg-config \
                 debhelper-compat cmake g++ \
                 libdrm-dev libgbm-dev libhybris-dev android-headers \
                 devscripts; then
              break
            fi
            echo "apt install attempt $attempt failed, retrying in 5s..."
            sleep 5
            apt-get update
            if [ "$attempt" = 5 ]; then
              echo "apt install failed after 5 attempts"
              exit 1
            fi
          done

      - name: build debian package
        run: |
          dpkg-buildpackage -b -uc -us -tc
          mkdir -p out
          cp ../*.deb out/ 2>/dev/null || true
          cp ../*.changes out/ 2>/dev/null || true
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: libgbm-hybris-trixie-arm64
          path: out/*
          if-no-files-found: error
